site_name: Renaissance Labs Wiki
site_url: https://wiki.renaissancelabs.eu/
site_description: Ideas and things we have built.
repo_url: https://github.com/BirgerMoell/renaissancelabs-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Ideas: ideas/index.md
  - Projects: projects/index.md
  - Contributing: contributing.md

exclude_docs: |
  _template.md
