site_name: Renaissance Labs Wiki
site_url: https://wiki.renaissancelabs.eu/
site_description: Ideas and things we have built.
repo_url: https://github.com/BirgerMoell/renaissancelabs-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - About: about.md
  - Ideas:
      - ideas/index.md
      - Swedish Nemotron first model: ideas/swedish-nemotron-first-model.md
      - Träna Nemotron på svenska: ideas/swedish-nemotron-first-model-sv.md
  - Projects:
      - projects/index.md
      - Explainer films from code: projects/code-rendered-videos.md
      - Swedish TTS intonation: projects/swedish-tts-intonation.md
      - Skrivbench: projects/skrivbench.md
      - How a frontier model is trained: projects/frontier-model-training.md
      - GPU hardware limits: projects/gpu-hardware-limits.md
      - RL rollouts with internet: projects/rl-rollouts-with-internet.md
  - Contributors:
      - contributors/index.md
      - The 8-pixel frog: contributors/nicolas-8-pixel-frog.md
      - "Swedish reasoning SFT": contributors/swedish-reasoning-sft.md
      - Small-model RL experiments on a laptop: contributors/small-model-rl-experiments.md
      - Verifiable Swedish RL environments and baselines: contributors/swedish-rl-environment-baselines.md
  - External resources:
      - external/index.md
      - Validating RL environments: external/marianna13-rl-validation.md
      - Mid-training and SFT data: external/marianna13-midtraining-data.md
  - Contributing: contributing.md

exclude_docs: |
  _template.md
